{% extends 'base_viloes.html' %}
{% block content %}
    <div class="container mt-4">
        <h2>Confirmar Exclusão</h2>
        <p>Tem certeza que deseja excluir o vilão <strong>{{ object.autor.codinome }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <a href="{% url 'lista_posts' %}" class="btn btn-secondary btn-pos">Cancelar</a>
            <button type="submit" class="btn btn-danger btn-pos">Excluir</button>
        </form>
    </div>
{% endblock %}
