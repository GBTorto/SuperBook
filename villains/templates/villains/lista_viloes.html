{# villains/templates/villains/lista_viloes.html #}
{% extends "base.html" %}

{% block content %}
  <h1>Vilões</h1>
  {% for villain in villains %}
    <p>{{ villain.codinome }}</p>
    <a href="{% url 'editar_viloes' villain.pk %}">Editar</a>
  {% endfor %}

  <a href="{% url 'form_viloes' %}">Cadastrar</a>
{% endblock %}
